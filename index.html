<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Genie Trips | Contacto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <img src="assets/logo sin fondo.png" alt="Logo Genie Trips" width="200">
        <h1>¡Comencemos tu próxima aventura!</h1>
    </header>

    <main>
        <p>Por favor, completa tus datos para que podamos asesorarte.</p>
        
        <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dg500000AFFdk" method="POST">
            <input type="hidden" name="oid" value="00Dg500000AFFdk">
            <!-- URL absoluta actualizada para producción en GitHub Pages -->
            <input type="hidden" name="retURL" value="https://guillelazzari.github.io/genie-trips-web/thanks.html">
            <input type="hidden" name="debug" value="1">
            <input type="hidden" name="debugEmail" value="guillerminalazzari@gmail.com">

            <div class="form-group">
                <label for="first_name">Nombre:</label><input id="first_name" maxlength="40" name="first_name" type="text" required />
            </div>

            <div class="form-group">
                <label for="last_name">Apellido:</label><input id="last_name" maxlength="80" name="last_name" type="text" required />
            </div>

            <div class="form-group">
                <label for="email">Email:</label><input id="email" maxlength="80" name="email" type="email" required />
            </div>

            <div class="form-group">
                <label for="phone">Teléfono:</label><input id="phone" maxlength="40" name="phone" type="tel" />
            </div>

            <div class="form-group">
                <label for="00Ng500000JSaFK">Número de Documento:</label><input id="00Ng500000JSaFK" maxlength="20" name="00Ng500000JSaFK" type="text" />
            </div>

            <div class="form-group">
                <label for="00Ng500000JSbph">Tipo de Cliente:</label>
                <select id="00Ng500000JSbph" name="00Ng500000JSbph">
                    <option value="">--Seleccione--</option>
                    <option value="Particular">Particular</option>
                    <option value="Empresa">Empresa</option>
                </select>
            </div>

            <div class="form-group">
                <label for="00Ng500000JSbxl">Tipo de Interés:</label>
                <select id="00Ng500000JSbxl" name="00Ng500000JSbxl">
                    <option value="">--Seleccione--</option>
                    <option value="Pasajes">Pasajes</option>
                    <option value="Hoteles">Hoteles</option>
                    <option value="Tours">Tours</option>
                    <option value="Paquete completo">Paquete completo</option>
                </select>
            </div>

            <input type="submit" name="submit" value="Enviar Consulta">
        </form>
    </main>

</body>
</html>
